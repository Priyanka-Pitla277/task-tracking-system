spring:
  datasource:
    url: jdbc:h2:mem:tasktracker;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-change-this-development-secret-key}
    expiration-ms: 86400000
  upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
